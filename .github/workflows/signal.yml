name: BTC Signal Scanner

on:
  schedule:
    - cron: '5 * * * *'
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore signal state
        uses: actions/cache/restore@v4
        with:
          path: .state
          key: btc-signal-state
          restore-keys: |
            btc-signal-state

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests numpy

      - name: Run signal engine
        env:
          TELEGRAM_TOKEN:   ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ACCOUNT_CAPITAL:  ${{ vars.ACCOUNT_CAPITAL }}
          LEVERAGE:         ${{ vars.LEVERAGE }}
          MIN_CONFIDENCE:   ${{ vars.MIN_CONFIDENCE }}
          RISK_PER_TRADE:   ${{ vars.RISK_PER_TRADE }}
          TP_PCT:           ${{ vars.TP_PCT }}
          SL_PCT:           ${{ vars.SL_PCT }}
        run: python signal_engine.py

      - name: Save signal state
        uses: actions/cache/save@v4
        if: always()
        with:
          path: .state
          key: btc-signal-state-${{ github.run_number }}
