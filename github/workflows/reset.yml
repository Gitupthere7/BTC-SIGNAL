name: Reset Signal State

on:
  workflow_dispatch:

jobs:
  reset:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reset state
        run: |
          mkdir -p .state
          echo '{"signal":null,"entry":null,"tp":null,"sl":null,"time":null,"consec":0}' > .state/last_signal.json
          cat .state/last_signal.json

      - name: Save cleared state
        uses: actions/cache/save@v4
        with:
          path: .state
          key: btc-signal-state-${{ github.run_number }}
